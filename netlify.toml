[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/api-auth-me"
  status = 200
  force = true

