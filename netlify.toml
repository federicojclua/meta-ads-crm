[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/api-auth-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/clients"
  to = "/.netlify/functions/api-clients"
  status = 200
  force = true

[[redirects]]
  from = "/api/clients/*"
  to = "/.netlify/functions/api-clients"
  status = 200
  force = true

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/api-users"
  status = 200
  force = true

[[redirects]]
  from = "/api/users/*"
  to = "/.netlify/functions/api-users"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = false
